[project]
name = "mailscrub"
version = "0.1.0"
description = "Terminal UI for bulk-unsubscribing from Gmail newsletters"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["gmail", "email", "unsubscribe", "newsletter", "tui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "cachetools>=5.0",
    "google-api-python-client>=2.100",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.1",
    "httpx>=0.25",
    "ratelimit>=2.2",
    "rich>=13.0",
    "textual>=0.80",
]

[project.urls]
Homepage = "https://github.com/brooksc/MailScrub"
Repository = "https://github.com/brooksc/MailScrub"
Issues = "https://github.com/brooksc/MailScrub/issues"

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "vulture>=2.10",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
